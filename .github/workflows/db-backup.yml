# Automated daily database backup (URS-17).
# Dumps the production Neon database with pg_dump (custom format) and keeps it as
# an encrypted-at-rest workflow artifact. Restore steps: docs/backup-restore.md.
#
# Required repository secret: BACKUP_DATABASE_URL (the *direct*, non-pooled
# Neon connection string, read-only role recommended).
name: Daily database backup

on:
  schedule:
    - cron: "17 16 * * *" # 16:17 UTC daily (off the hour to avoid queue spikes)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 18 client (must be >= the Neon server version)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          test -n "$BACKUP_DATABASE_URL" || { echo "BACKUP_DATABASE_URL secret is not set"; exit 1; }
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          PGBIN=/usr/lib/postgresql/18/bin
          $PGBIN/pg_dump --format=custom --no-owner --no-privileges --file="webops-$STAMP.dump" "$BACKUP_DATABASE_URL"
          # Prove the file is a readable archive before we trust it.
          $PGBIN/pg_restore --list "webops-$STAMP.dump" > "webops-$STAMP.toc"
          test -s "webops-$STAMP.toc"
          sha256sum "webops-$STAMP.dump" > "webops-$STAMP.dump.sha256"
          ls -l

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: webops-db-backup-${{ github.run_id }}
          path: |
            webops-*.dump
            webops-*.dump.sha256
          # GitHub caps artifact retention at 90 days. Copy a monthly dump to
          # long-term storage to meet the record-retention period.
          retention-days: 90
          if-no-files-found: error
